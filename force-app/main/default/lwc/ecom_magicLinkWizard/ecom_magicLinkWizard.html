<template>
    <template if:true={showSpinner}>
        <div class="backdrop">
            <lightning-spinner class="spinshow" size="large" variant="brand" alternative-text="Loading">
            </lightning-spinner>
        </div>
    </template>
    <div class={cardStyling}>
        <div if:true={displayMessage}>
            <div class={messageStyling}>
                <div>{messageText}</div>
                <span class="ecom-close-button">
                    <img class="slds-button__icon slds-button__icon_medium slds-button__icon_left ecom-icon-size"
                    aria-hidden="true" src={images.closeIcon} onclick={closePrompt}></span>
            </div>
        </div>
        <div class="ecom-header">
            <div>
                <div class="ecom-text-size-40 ecom-line-height-48">
                    {labels.ECOM_Punchout_Login_Header}
                </div>
                <div class="ecom-text-size-32">
                    {labels.ECOM_Punchout_Login_Sub_Header}
                </div>
            </div>
        </div>

        <div class="input-container">
            <div if:true={showEmailContainer}>
                <!--UserName-->
                <div class="ecom-padding-bottom-32">
                    <div class="ecom-text-size-30 ecom-line-height-30">{labels.ECOM_Punchout_Login_Email_Instructions}
                    </div>
                    <div class="ecom-margin-bottom-4">
                        <label class="ecom-detail-text-18 ecom-font-weight-400"
                            for="username-input">{labels.ECOM_LBL_EMAILADDRESS} *</label>
                    </div>
                    <div>
                        <input type="text" name="username" id="username-input" value={userEmail} required
                            class='slds-input' onfocusout={validateUserName}></input>
                        <div lwc:if={usernameError} class="ecom-error-text">{usernameErrorMessage}</div>
                    </div>
                </div>
            </div>

            <div>
                <button if:true={showLoginButton} lwc:ref="loginBtn" class="ecom-login" onclick={handleUserLogin}
                    onkeypress={handleEnter}>
                    <span>{labels.ECOM_Punchout_Login_Magic_Link_Button_Label}</span>
                </button>
                <div if:false={showLoginButton} class="ecom-email-sent">
                    <span>{labels.ECOM_Punchout_Login_Email_Sent_Message}</span>
                </div>
            </div>
        </div>
    </div>

</template>
