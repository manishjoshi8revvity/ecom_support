<template>

    <template if:true={showSpinner}>
        <div class="backdrop">
            <lightning-spinner class="spinshow" size="large" variant="brand" alternative-text="Loading">
            </lightning-spinner>
        </div>
    </template>
    <!-- LOGIN PAGE -->
    <template if:true={loginPage}>
        <div class="page">
            <div class="card">
                <div class="header">
                    <!-- <h2 class="title">Login to your Revvity Account</h2> -->
                    <p class="sub">Enter email address to receive OTP</p>
                </div>

                <!-- RADIO OPTIONS (Email preselected + disabled, SMS disabled) -->
                <!-- <div class="radio-block">
                    <div class="radio-group">
                        <label class="radio">
                            <input
                                type="radio"
                                id="emailOption"
                                name="loginOption"
                                value="Email"
                                checked
                                disabled
                            />
                            <span class="radio-dot" aria-hidden="true"></span>
                            <span class="radio-label">Email</span>
                        </label>

                        <label class="radio">
                            <input
                                type="radio"
                                id="smsOption"
                                name="loginOption"
                                value="SMS"
                                disabled
                            />
                            <span class="radio-dot" aria-hidden="true"></span>
                            <span class="radio-label">SMS</span>
                        </label>
                    </div>
                </div> -->

                <!-- Identifier input -->
                <div class="section">
                    <template if:true={isEmailSelected}>
                        <lightning-input
                            class="field"
                            type="email"
                            label="Email Address *"
                            value={email}
                            onchange={handleIdentifier}
                        ></lightning-input>
                    </template>

                    <template if:true={isSmsSelected}>
                        <lightning-input
                            class="field"
                            type="tel"
                            label="Phone Number"
                            value={phone}
                            onchange={handleIdentifier}
                        ></lightning-input>
                    </template>
                </div>

                <!-- Error -->
                <template if:true={showErrorMessage}>
                    <div class="error" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <!-- Actions -->
                <div class="actions">
                    <button class="ecom-login" onclick={handleSendOtp}>
                        <span>Send OTP</span>
                    </button>

                    <!-- <button class="ecom-login slds-m-left_medium slds-m-right_medium" onclick={handleMagicLinkLogin} data-source="direct">
                        <span>Direct Login</span>
                    </button> -->

                    <button class="ecom-login slds-m-left_medium slds-m-right_medium" onclick={handleMagicLinkLogin} data-source="email">
                        <span>Email Login</span>
                    </button>

                </div>
            </div>
        </div>
    </template>

    <!-- OTP PAGE -->
    <template if:true={otpPage}>
        <div class="page">
            <div class="card">
                <div class="header">
                    <h2 class="title">Verify OTP</h2>
                    <p class="sub">Enter the 6-digit OTP</p>
                </div>

                <div class="section">
                    <lightning-input
                        class="field"
                        label="Enter OTP"
                        name="otp"
                        type="text"
                        max="6"
                        value={otp}
                        onchange={handleOtpChange}
                    ></lightning-input>
                </div>

                <template if:true={showErrorMessage}>
                    <div class="error" role="alert">
                        {errorMessage}
                    </div>
                </template>

                <div class="otp-actions">
                    <lightning-button
                        variant="base"
                        label="Resend OTP"
                        title="Resend OTP"
                        onclick={handleSendOtp}
                    ></lightning-button>

                    <button
                        class="ecom-login"
                        onclick={handleVerifyOtp}
                        disabled={disableVerifyButton}
                    >
                        Verify
                    </button>
                </div>

                <div class="footer">
                    <button class="ecom-login" onclick={backButton}>
                        <span>Back</span>
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
